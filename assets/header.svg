<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <!-- GitHub Dark Canvas Default #0d1117 -->
  <rect width="850" height="200" rx="10" fill="#0d1117"/>
  
  <!-- GitHub Dark Canvas Sub / Panel #161b22 with #30363d border -->
  <rect x="1" y="1" width="848" height="198" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>

  <!-- Terminal Window Bar Header -->
  <path d="M1 10C1 5.02944 5.02944 1 10 1H840C844.971 1 849 5.02944 849 10V36H1V10Z" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="18" r="5" fill="#f85149"/>
  <circle cx="38" cy="18" r="5" fill="#d29922"/>
  <circle cx="54" cy="18" r="5" fill="#3fb950"/>
  <text x="74" y="22" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">ishwar-prajapati@github: ~ (main)</text>

  <!-- Left Side: Terminal Command & Identity -->
  <g transform="translate(36, 62)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#58a6ff">$</text>
    <text x="16" y="0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9">whoami</text>
    
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f0f6fc">
      Ishwar Prajapati
    </text>
    
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">
      Full-Stack &amp; Mobile App Engineer · 70+ Repositories · Scalable Architectures
    </text>

    <!-- GitHub Primer Badges / Pills -->
    <g transform="translate(0, 84)">
      <!-- Pill 1: MERN Stack -->
      <rect x="0" y="0" width="110" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#58a6ff"/>
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#c9d1d9">MERN Stack</text>

      <!-- Pill 2: Next.js & React -->
      <rect x="118" y="0" width="124" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="130" cy="12" r="3.5" fill="#3fb950"/>
      <text x="142" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#c9d1d9">Next.js &amp; React</text>

      <!-- Pill 3: Mobile Apps -->
      <rect x="250" y="0" width="138" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="262" cy="12" r="3.5" fill="#a371f7"/>
      <text x="274" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#c9d1d9">Flutter &amp; RN</text>

      <!-- Pill 4: Cloud & APIs -->
      <rect x="396" y="0" width="128" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="408" cy="12" r="3.5" fill="#d29922"/>
      <text x="420" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#c9d1d9">REST &amp; Cloud</text>
    </g>
  </g>

  <!-- Right Side: GitHub Octicon Terminal Emblem -->
  <g transform="translate(710, 68)">
    <rect width="90" height="90" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <path d="M26 32L40 45L26 58" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="46" y1="58" x2="64" y2="58" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
