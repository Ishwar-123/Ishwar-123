name: Update Developer Stats

on:
  schedule:
    # Runs every 6 hours (5:30 AM, 11:30 AM, 5:30 PM, 11:30 PM IST)
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'profile-3d-contrib/**'
      - 'github-metrics.svg'
      - 'github-achievements.svg'
      - 'README.md'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Stats Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-stats.js

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No stats changes detected."
          else
            git commit -m "chore(stats): update live developer metrics and streak [skip ci]"
            git push
          fi
