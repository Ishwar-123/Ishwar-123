name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Ishwar-123
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00F0FF&color_dots=#ebedf0,#d7cbf0,#a889e6,#7849d9,#8E2DE2
            dist/github-contribution-grid-snake-dark.svg?color_bg=0D1117&color_snake=00F0FF&color_dots=#161B22,#3B1D61,#5A2492,#7A2AC3,#8E2DE2
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
