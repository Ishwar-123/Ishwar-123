name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Ishwar-123
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=38BDF8&color_dots=#ebedf0,#c7d2fe,#818cf8,#4f46e5,#312e81
            dist/github-contribution-grid-snake-dark.svg?color_bg=0D1117&color_snake=38BDF8&color_dots=#161B22,#1e1b4b,#312E81,#4338CA,#818CF8
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
